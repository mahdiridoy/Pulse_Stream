[workspace]
resolver = "2"
members = [
    "crates/pulse-core",
    "crates/pulse-tui",
    "crates/pulse-web",
]
default-members = [
    "crates/pulse-tui",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal", "process", "net"] }

# HTTP
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rmp-serde = "1.3.1"

# Crypto
base64 = "0.23.0"
hmac = "0.13.0"
md-5 = "0.11.0"
sha2 = "0.10.8"

# HTML parsing
scraper = "0.27.0"

# DNS
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }

# Error handling
thiserror = "2.0.18"

# Logging
log = "0.4.33"
flexi_logger = "0.31.10"

# Utilities
futures = "0.3.31"
url = "2.5.8"
rand = "0.10.2"
percent-encoding = "2.3.2"
lru = "0.18.1"
dirs = "6.0.0"
semver = "1.0.28"
tempfile = "3.17.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

# TLS
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }

# Compression
flate2 = "1.0.35"
tar = "0.4.44"
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }

# Web framework (for pulse-web)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
http = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }

# Redis
fred = { version = "10", features = ["i-std"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"
manual_is_multiple_of = "allow"
nonminimal_bool = "allow"
